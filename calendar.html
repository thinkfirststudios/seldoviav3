<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Seldovia community calendar — a smooth, scrollable agenda of upcoming events, with an optional month view.">
<meta name="theme-color" content="#F8E6DD">
<title>Community Calendar — Seldovia.com</title>
<link rel="stylesheet" href="styles.css?v=89">
</head>
<body data-page="calendar">
<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
  <div class="page-banner"><img src="images/headers/banner-calendar.jpg" alt="The Happenings Around Town" width="1536" height="288"></div>

  <section class="section wrap">
    <!-- TOCKIFY calendar embed (preview). To revert to the custom calendar, restore the
         previous cal-toolbar/agenda/monthgrid block + <script calendar.js> from git history. -->
    <div class="tockify-wrap" style="min-height:520px">
      <div data-tockify-component="calendar" data-tockify-calendar="seldovia"></div>
    </div>
    <script data-cfasync="false" data-tockify-script="embed" src="https://public.tockify.com/browser/embed.js"></script>
    <p class="cal-note">Community calendar powered by Tockify.</p>
  </section>
</main>
<script src="db.js?v=6"></script>
<script src="app.js?v=84"></script>
</body>
</html>
