<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explore Seldovia — the most popular things to do, filtered by dining, lodging, charters, outdoors, and arts.">
<meta name="theme-color" content="#F8E6DD">
<title>Explore Seldovia — Directory of Places</title>
<link rel="stylesheet" href="styles.css?v=104">
</head>
<body data-page="explore">
<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
  <div class="page-banner"><img src="images/headers/banner-explore.jpg" alt="Things to Do &amp; Places to Go" width="1536" height="288"></div>

  <!-- SELDOVIA TRAILS — guides pulled from the 2011 Seldovia Visitor guide, hosted locally -->
  <style>
    .trail-grid{display:flex; flex-wrap:wrap; justify-content:center; gap:18px;}
    .trail-card{display:block; width:240px; max-width:80vw; background:var(--sheet); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); text-decoration:none; color:inherit; transition:transform .12s ease, box-shadow .15s ease;}
    .trail-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
    .trail-card img{display:block; width:100%; height:auto;}
    .trail-name{display:block; padding:.7rem 1rem; font-weight:700; text-align:center; color:var(--heading);}
  </style>
  <!-- Trails section moved to the bottom of the page (Jenny #3) -->

  <section class="section wrap">
    <div class="tabs" id="placeTabs" role="group" aria-label="Filter listings"></div>
    <div class="place-grid" id="placeGrid"></div>
  </section>

  <section class="section wrap" style="padding-top:0">
    <div class="feature">
      <div class="feature-body">
        <span class="eyebrow" id="featEyebrow" style="margin-bottom:.5rem">Local Favorite</span>
        <h3 id="featTitle">Best of the Boardwalk</h3>
        <p id="featBody">The historic boardwalk is the heart of Seldovia — homes on stilts above the tide, little galleries, and the best cinnamon rolls in town. Stroll it once and you’ll understand why folks never leave.</p>
        <a class="btn btn-primary" id="featBtn" href="phone-book.html">Browse the phone book</a>
      </div>
      <div class="feature-media" id="featureMedia" aria-hidden="true"></div>
    </div>
  </section>

  <!-- Trails fliers + title removed (Jenny Oct 2): that info now lives on each trail/hike card. -->
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js?v=6"></script>
<script src="app.js?v=103"></script>
<script src="feature.js?v=1"></script>
</body>
</html>
