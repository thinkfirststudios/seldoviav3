# Netlify config — static site, no build step. The repo root IS the site.
# Netlify auto-detects the phone-book signup form (data-netlify="true") on deploy.
[build]
  publish = "."
  # No build step: overrides the old Astro build command still saved in the Netlify project settings.
  command = "echo Static site, nothing to build"

# Friendly URLs (optional): /add -> the phone book signup form
[[redirects]]
  from = "/add"
  to = "/directory-add.html"
  status = 301

# Security headers (Oct 26): stop other sites framing the pages (clickjacking), stop file-type guessing,
# keep full page addresses private when visitors click out, and allow only what the site uses
# (location is needed for "Find me" on the map; camera/microphone are never used).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
