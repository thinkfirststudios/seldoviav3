<main id="main">
  <section class="section wrap" style="text-align:center; max-width:760px; margin:0 auto">
    <span class="eyebrow">Seldovia.com has a new look</span>
    <h1 class="nf-title">This page has moved</h1>

    <form class="nf-search" action="search.html" role="search">
      <input type="search" name="q" id="nfQ" placeholder="Search everything in Seldovia…" aria-label="Search Seldovia.com">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/db.js?v=6"></script>
<script src="/app.js?v=133"></script>
<script>
/* Old seldovia.com addresses that aren't in _redirects (e.g. a post added after the move): look the address up in
   the News & Stories archive and forward there; otherwise offer a search with the words from the old address. */
(function(){
  var slug = decodeURIComponent(location.pathname.replace(/\/+$/,"").split("/").pop()||"").toLowerCase().replace(/\.html?$/,"");
  var words = slug.replace(/[-_]+/g," ").replace(/\b\d+\b/g," ").trim();
  var q = document.getElementById("nfQ"), msg = document.getElementById("nfMsg");
  if(words) q.value = words;
  var giveUp = function(){ msg.textContent = words ? "We couldn't find that exact page, but these words might help. Try a search:" : "Try a search, or pick a page below:"; };
  if(!slug || !window.db){ giveUp(); return; }
  db.from("posts").select("id").eq("slug", slug).limit(1).then(function(r){
    if(r && r.data && r.data.length){ msg.textContent = "Found it! Taking you there…"; location.replace("post.html?id=" + encodeURIComponent(r.data[0].id)); }
    else giveUp();
  }, giveUp);
})();
</script>
</body>
</html>
